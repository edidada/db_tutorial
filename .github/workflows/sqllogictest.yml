name: SQLLogicTest (Result Verification)

on:
  push:
    branches:
      - edidada/cmake
  workflow_dispatch:

jobs:
  sqllogictest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure and build
        run: |
          cmake -S . -B build
          cmake --build build

      - name: Write SLT case and runner
        run: |
          mkdir -p tests/sqllogictest
          cat > tests/sqllogictest/basic.slt <<'EOF'
          # Minimal SQLLogicTest-style case for the supported SQL subset
          statement ok
          insert 1 alice alice@example.com

          statement ok
          insert 2 bob bob@example.com

          statement ok
          insert 3 carol carol@example.com

          query III
          select
          ----
          (1, alice, alice@example.com)
          (2, bob, bob@example.com)
          (3, carol, carol@example.com)

          statement ok
          .exit
          EOF
          cat > tests/sqllogictest/run.py <<'EOF'
          import os
          import re
          import subprocess
          import sys
          import tempfile

          DB = "./build/db"
          CASE = "tests/sqllogictest/basic.slt"

          commands = []
          expected = []
          with open(CASE) as f:
              lines = [line.rstrip("\n") for line in f]

          i = 0
          while i < len(lines):
              line = lines[i].strip()
              if not line or line.startswith("#"):
                  i += 1
                  continue
              if line.startswith("statement"):
                  i += 1
                  while i < len(lines) and not lines[i].strip():
                      i += 1
                  commands.append(lines[i].strip())
                  i += 1
              elif line.startswith("query"):
                  i += 1
                  while i < len(lines) and not lines[i].strip():
                      i += 1
                  commands.append(lines[i].strip())
                  i += 1
                  while i < len(lines) and lines[i].strip() != "----":
                      i += 1
                  i += 1
                  while i < len(lines) and lines[i].strip():
                      expected.append(lines[i].strip())
                      i += 1
              else:
                  i += 1

          fd, dbfile = tempfile.mkstemp(suffix=".db")
          os.close(fd)
          os.unlink(dbfile)

          proc = subprocess.run(
              [DB, dbfile],
              input="\n".join(commands) + "\n",
              text=True,
              capture_output=True,
              timeout=60,
          )
          print(proc.stdout)
          normalized = [
              re.sub(r"^db >\s*", "", line).strip()
              for line in proc.stdout.splitlines()
          ]
          actual = [line for line in normalized if line and line != "Executed."]

          missing = [row for row in expected if row not in actual]
          if missing:
              print("SQLLogicTest FAILED, missing rows:", missing)
              sys.exit(1)

          print("SQLLogicTest passed: %d expected rows verified" % len(expected))
          EOF

      - name: Run SQLLogicTest
        run: python3 tests/sqllogictest/run.py
