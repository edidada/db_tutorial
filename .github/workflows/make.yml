name: Build with Make

on:
  push:
    branches:
      - edidada/make
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          sed -i 's/\r$//' Makefile
          make db

      - name: Run
        run: |
          output="$(printf 'insert 1 user1 person1@example.com\nselect\n.exit\n' | ./db mydb.db)"
          echo "$output"
          echo "$output" | grep -Fq 'user1'
